server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # SPA: cualquier ruta que no sea un archivo real la resuelve el router de Vue.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML no se cachea: así un despliegue nuevo se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # config.js lo reescribe el entrypoint en cada arranque: si el navegador lo
    # cachea, un cambio en el ConfigMap no tendría efecto.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # El resto del bundle lleva hash en el nombre: se cachea agresivo.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
